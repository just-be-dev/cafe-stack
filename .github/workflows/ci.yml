name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only verifies. It has no secrets and never runs Alchemy, so nothing here
# deploys or touches Cloudflare.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun's package cache, restored before mise runs the install hook.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Installs the Bun and Node.js pinned in mise.toml (cached by the action).
      # mise's postinstall hook also runs `bun install --frozen-lockfile`, but a
      # failing hook only logs a warning and `mise install` still succeeds.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # The step that enforces the lockfile: it fails when package.json and
      # bun.lock disagree. A no-op when the hook already installed cleanly.
      - run: bun install --frozen-lockfile

      - run: mise run check
      - run: mise run build

  # Playwright against `vite preview` builds of the UI (one at `/`, one under
  # BASE_PATH=/app/). The specs answer `/api/*` in the test process with the
  # real routes from src/api.ts, so this job runs no Worker and no Alchemy.
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - run: bun install --frozen-lockfile

      # Chromium and WebKit at the versions the pinned @playwright/test expects,
      # plus the system libraries they need on Ubuntu.
      - run: mise run test:e2e:install --with-deps

      - run: mise run test:e2e

      # Traces, screenshots, axe reports, and the HTML report, for failed runs only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
