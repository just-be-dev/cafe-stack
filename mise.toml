[settings]
experimental = true
pin = true

[hooks]
postinstall = "bun install --frozen-lockfile"

[env]
_.path = "node_modules/.bin"

[tasks.check]
description = "Typecheck, lint, test, and check formatting"
run = "bun run typecheck && bun run lint && bun run test && bun run format:check"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.lint]
run = "bun run lint"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.test]
run = "bun run test"

[tasks."test:watch"]
run = "bun run test:watch"

[tasks.build]
run = "bun run build"

[tasks.dev]
run = "bun run dev"

[tasks.deploy]
run = "bun run deploy --stage prod"

[tasks.prepare]
run = "bun run prepare"

[tasks."cloudflare:profile"]
description = "Add a Cloudflare profile for Alchemy"
run = "alchemy profile edit --add Cloudflare"

[tasks."effect-solutions"]
description = "Browse Effect Solutions guides, e.g. `list` or `show <topic>`"
run = "bunx effect-solutions"

[tasks."ui:add"]
description = "Add a foldcn component to src/ui"
usage = 'arg "<name>" help="foldcn component name, e.g. button"'
run = 'bunx shadcn@latest add "@foldcn/${usage_name}"'

[tasks."foldkit:source"]
description = "Shallow-clone Foldkit at the installed release tag into repos/foldkit"
run = '''
set -eu
version=$(node -p 'require("./node_modules/foldkit/package.json").version')
tag="foldkit@$version"
dest=repos/foldkit
case "$version" in
  *-*) echo "foldkit $version is a prerelease; clone the commit named in its version by hand" >&2; exit 1 ;;
esac
if [ -d "$dest/.git" ] && git -C "$dest" tag --points-at HEAD | grep -qxF "$tag"; then
  echo "$dest is already at $tag"
  exit 0
fi
mkdir -p repos
rm -rf "$dest.tmp"
git -c advice.detachedHead=false clone --quiet --depth 1 --single-branch --branch "$tag" https://github.com/foldkit/foldkit.git "$dest.tmp"
rm -rf "$dest"
mv "$dest.tmp" "$dest"
echo "Cloned $tag into $dest"
'''

[tasks.patch]
description = "Prepare a dependency in node_modules for patching"
usage = 'arg "<package>" help="package name, e.g. @foldkit/vite-plugin"'
run = 'bun patch "${usage_package}"'

[tasks."patch:commit"]
description = "Save edits to a patched dependency into patches/"
usage = 'arg "<package>" help="package name, e.g. @foldkit/vite-plugin"'
run = 'bun patch --commit "node_modules/${usage_package}"'

[tools]
bun = "1.4.3"
node = "24.18.1"
